<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>노무 위키 v3.0</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #f4f6f8; color: #1a1a1a; display: flex; height: 100vh; overflow: hidden; }
        
        /* 사이드바 스타일 */
        .sidebar { width: 280px; background: #ffffff; border-right: 1px solid #e5e7eb; padding: 25px 20px; display: flex; flex-direction: column; }
        .brand h1 { font-size: 20px; font-weight: 800; color: #111; letter-spacing: -0.5px; margin-bottom: 15px; }
        
        .sidebar-search-container { width: 100%; margin-bottom: 20px; }
        .sidebar-search-box {
            width: 100%;
            padding: 11px 16px;
            background-color: #f8f9fa;
            border: 1.5px solid #dee2e6;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            transition: all 0.15s;
        }
        .sidebar-search-box:focus {
            outline: none;
            border-color: #1a73e8;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.1);
        }

        .category-list { list-style: none; flex-grow: 1; overflow-y: auto; }
        .category-item { padding: 12px 14px; color: #495057; font-size: 13px; font-weight: 500; cursor: pointer; border-radius: 8px; margin-bottom: 4px; transition: all 0.15s; }
        .category-item:hover { background: #f1f3f5; color: #111; }
        .category-item.active { background: #e8f0fe; color: #1a73e8; font-weight: 600; }
        
        /* 메인 콘텐츠 영역 스타일 */
        .main-content { flex-grow: 1; background: #f8f9fa; padding: 35px; overflow-y: auto; display: flex; flex-direction: column; }
        
        .ai-search-bar-container { 
            width: 100%; 
            display: flex; 
            gap: 12px; 
            margin-bottom: 35px; 
            background: #ffffff;
            padding: 8px;
            border: 3px solid #1a73e8; 
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(26, 115, 232, 0.12); 
        }
        .ai-chat-input { 
            flex-grow: 1; 
            padding: 14px 18px; 
            background-color: transparent; 
            border: none;
            color: #111111; 
            font-size: 15px; 
            font-weight: 700; 
        }
        .ai-chat-input:focus { outline: none; }
        .ai-chat-input::placeholder { color: #1a73e8; opacity: 0.55; }
        
        .ai-submit-btn { 
            background-color: #1a73e8; 
            color: #ffffff; 
            border: none; 
            padding: 0 32px; 
            border-radius: 10px; 
            font-size: 14px; 
            font-weight: 800; 
            cursor: pointer; 
            transition: background 0.2s; 
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
        }
        .ai-submit-btn:hover { background-color: #0d47a1; }
        
        .content-title { font-size: 22px; font-weight: 800; color: #111; margin-bottom: 20px; }
        .content-meta-info { font-size: 12px; color: #6c757d; margin-top: -15px; margin-bottom: 20px; font-weight: 600; }
